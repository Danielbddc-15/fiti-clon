name: Deploy Worker and Frontend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend with proxy URL
        env:
          # Configure your production proxy URL in the repository secret `PROXY_URL`
          VITE_PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          npm run build

      - name: Deploy frontend to GitHub Pages
        run: |
          npm run deploy

      - name: Done
        run: echo "Deployed worker and frontend. If the worker subdomain differs, update VITE_PROXY_URL in this workflow or set it as a secret."
